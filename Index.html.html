<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регионы России — Новостной мониторинг</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ─── RESET & TOKENS ──────────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080d18;
  --bg2:#0f1624;
  --bg3:#161f30;
  --bg4:#1c2840;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.13);
  --border3:rgba(255,255,255,0.22);
  --accent:#2563eb;
  --accent-l:#3b82f6;
  --accent-xl:#60a5fa;
  --accent-dim:rgba(37,99,235,0.15);
  --green:#059669;
  --green-l:#10b981;
  --green-dim:rgba(5,150,105,0.12);
  --amber:#d97706;
  --amber-l:#f59e0b;
  --amber-dim:rgba(217,119,6,0.12);
  --red:#dc2626;
  --red-l:#ef4444;
  --tg:#0088cc;
  --tg-l:#2ea6ff;
  --tg-dim:rgba(0,136,204,0.12);
  --text:#e8edf5;
  --muted:#7a8ba8;
  --muted2:#4a5568;
  --r:10px;
  --r-sm:6px;
}
html{font-size:14px}
body{font-family:'Golos Text',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ─── NOISE OVERLAY ───────────────────────────────────────── */
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:.4;pointer-events:none;z-index:0
}

/* ─── HEADER ─────────────────────────────────────────────── */
header{
  position:relative;z-index:100;
  display:flex;align-items:center;gap:20px;
  padding:0 20px;height:52px;
  background:rgba(8,13,24,0.95);
  border-bottom:1px solid var(--border2);
  backdrop-filter:blur(20px);
  flex-shrink:0;
}
.logo{
  font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;
  letter-spacing:-.3px;white-space:nowrap;
  display:flex;align-items:center;gap:8px
}
.logo-flag{font-size:18px}
.logo-dot{color:var(--accent-l);margin:0 2px}

/* GLOBAL SEARCH */
.global-search{
  flex:1;max-width:480px;position:relative
}
.global-search input{
  width:100%;height:34px;
  background:var(--bg3);
  border:1px solid var(--border2);
  border-radius:var(--r-sm);
  padding:0 12px 0 36px;
  color:var(--text);font-family:inherit;font-size:13px;
  outline:none;transition:border-color .2s,box-shadow .2s
}
.global-search input:focus{
  border-color:var(--accent-l);
  box-shadow:0 0 0 3px rgba(59,130,246,0.12)
}
.global-search input::placeholder{color:var(--muted2)}
.search-ico{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:15px;pointer-events:none;line-height:1
}
.search-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  color:var(--muted2);cursor:pointer;font-size:16px;
  display:none;line-height:1;transition:color .15s
}
.search-clear:hover{color:var(--text)}

/* SEARCH TAGS */
.search-tags{
  display:flex;align-items:center;gap:6px;flex-shrink:0
}
.stag{
  padding:3px 10px;border-radius:20px;
  border:1px solid var(--border2);
  background:transparent;color:var(--muted);
  font-size:11px;cursor:pointer;
  font-family:inherit;transition:all .15s
}
.stag:hover{border-color:var(--accent-l);color:var(--accent-xl)}
.stag.active{background:var(--accent-dim);border-color:var(--accent-l);color:var(--accent-xl)}

/* HEADER RIGHT */
.header-right{
  margin-left:auto;display:flex;align-items:center;gap:12px
}
.live-pill{
  display:flex;align-items:center;gap:5px;
  background:var(--green-dim);
  border:1px solid rgba(16,185,129,.25);
  color:var(--green-l);
  padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500
}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--green-l);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
#hclock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ─── SEARCH RESULTS BAR ─────────────────────────────────── */
#search-bar{
  display:none;
  background:var(--bg2);border-bottom:1px solid var(--border2);
  padding:6px 20px;
  align-items:center;gap:10px;
  font-size:12px;color:var(--muted);
  flex-shrink:0;z-index:90;position:relative
}
#search-bar.visible{display:flex}
.sq-tag{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--accent-dim);border:1px solid rgba(59,130,246,.3);
  color:var(--accent-xl);padding:2px 8px;border-radius:4px;font-weight:500
}
#search-stats{margin-left:auto;color:var(--muted2)}

/* ─── MAIN LAYOUT ───────────────────────────────────────── */
.main{
  flex:1;overflow:hidden;
  display:grid;
  grid-template-columns:270px 1fr 300px;
  position:relative;z-index:1
}

/* ─── SCROLLBARS ────────────────────────────────────────── */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--border3)}

/* ─── LEFT PANEL ─────────────────────────────────────────── */
.left-panel{
  background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden
}
.lp-tabs{
  display:flex;border-bottom:1px solid var(--border);flex-shrink:0
}
.lp-tab{
  flex:1;padding:10px 0;text-align:center;
  font-size:11px;font-weight:500;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;
  transition:all .15s;letter-spacing:.3px
}
.lp-tab.active{color:var(--accent-xl);border-bottom-color:var(--accent-l)}
.lp-tab:hover:not(.active){color:var(--text)}

.lp-body{flex:1;overflow-y:auto;padding:10px}

/* REGION SEARCH */
.reg-search{position:relative;margin-bottom:10px}
.reg-search input{
  width:100%;height:30px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:0 10px 0 30px;
  color:var(--text);font-family:inherit;font-size:12px;outline:none;
  transition:border-color .2s
}
.reg-search input:focus{border-color:var(--accent-l)}
.reg-search input::placeholder{color:var(--muted2)}
.reg-search-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:13px;pointer-events:none}

/* DISTRICT */
.district-btn{
  display:flex;align-items:center;gap:8px;
  padding:7px 9px;border-radius:var(--r-sm);
  cursor:pointer;transition:background .15s;
  margin-bottom:2px
}
.district-btn:hover{background:var(--bg4)}
.district-btn.active{background:var(--accent-dim);border:1px solid rgba(59,130,246,.2)}
.d-swatch{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d-name{font-size:12px;flex:1}
.d-count{font-size:10px;color:var(--muted2);background:var(--bg4);padding:1px 6px;border-radius:10px}

/* REGION ITEM */
.region-btn{
  display:flex;align-items:center;gap:7px;
  padding:5px 9px;border-radius:var(--r-sm);
  cursor:pointer;transition:background .15s;
  font-size:12px;
}
.region-btn:hover{background:var(--bg3)}
.region-btn.active{background:rgba(59,130,246,.12);color:var(--accent-xl)}
.rb-dot{width:5px;height:5px;border-radius:50%;background:var(--muted2);flex-shrink:0}
.region-btn.active .rb-dot{background:var(--accent-l)}
.rb-name{flex:1;line-height:1.3}
.rb-news{font-size:10px;color:var(--muted2)}
.rb-news.has-news{color:var(--accent-xl)}

/* ─── CENTER PANEL ───────────────────────────────────────── */
.center{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* MAP */
.map-wrap{
  flex-shrink:0;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  position:relative;
  height:300px;overflow:hidden
}
#map-svg{width:100%;height:100%;display:block}
.map-region{
  fill:#12213a;stroke:#1e3050;stroke-width:.4;
  cursor:pointer;transition:fill .18s,stroke .18s
}
.map-region:hover{fill:#1e3a5f;stroke:#2d5a8f}
.map-region.mr-active{fill:#1d4ed8;stroke:#60a5fa;stroke-width:.8}
.map-region.mr-hasnews{fill:#16305a}
.map-region.mr-highlight{fill:#1e3d7a;stroke:#3b7de0;stroke-width:.6}

.map-controls{
  position:absolute;top:10px;left:10px;
  display:flex;gap:6px;flex-wrap:wrap
}
.mc-btn{
  background:rgba(8,13,24,.85);
  border:1px solid var(--border2);
  color:var(--muted);font-size:10px;
  padding:4px 9px;border-radius:20px;
  cursor:pointer;backdrop-filter:blur(8px);
  transition:all .15s;font-family:inherit
}
.mc-btn:hover,.mc-btn.active{background:rgba(37,99,235,.2);border-color:var(--accent-l);color:var(--accent-xl)}

.map-legend{
  position:absolute;bottom:10px;right:10px;
  background:rgba(8,13,24,.88);border:1px solid var(--border2);
  border-radius:var(--r-sm);padding:8px 10px;font-size:10px;
  backdrop-filter:blur(10px);
}
.ml-row{display:flex;align-items:center;gap:6px;color:var(--muted);margin-bottom:4px}
.ml-row:last-child{margin-bottom:0}
.ml-sw{width:10px;height:10px;border-radius:2px;flex-shrink:0}

#mtooltip{
  position:absolute;
  background:rgba(8,13,24,.95);border:1px solid var(--border2);
  border-radius:var(--r-sm);padding:7px 11px;
  font-size:11px;pointer-events:none;display:none;z-index:50;
  backdrop-filter:blur(12px);max-width:220px;line-height:1.5
}
#mtt-name{font-weight:600;margin-bottom:2px;color:var(--text)}
#mtt-district{color:var(--muted);font-size:10px;margin-bottom:4px}
#mtt-sources{color:var(--muted);font-size:10px}

/* NEWS AREA */
.news-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.news-toolbar{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;border-bottom:1px solid var(--border);
  flex-shrink:0
}
.news-title{
  font-family:'Unbounded',sans-serif;
  font-size:12px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:220px
}
.news-filters{display:flex;gap:5px;margin-left:auto;flex-shrink:0}
.nf-btn{
  padding:3px 9px;border-radius:20px;
  border:1px solid var(--border);background:transparent;
  color:var(--muted);font-size:10px;cursor:pointer;
  font-family:inherit;transition:all .15s
}
.nf-btn:hover{border-color:var(--border3);color:var(--text)}
.nf-btn.active{background:var(--accent-dim);border-color:var(--accent-l);color:var(--accent-xl)}

#news-list{flex:1;overflow-y:auto;padding:12px 14px}

/* NEWS CARD */
.ncard{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:12px 14px;margin-bottom:9px;
  cursor:pointer;transition:border-color .15s,transform .15s;
  position:relative;overflow:hidden
}
.ncard::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2.5px;
  background:var(--accent-l);opacity:0;transition:opacity .15s
}
.ncard.type-tg::before{background:var(--tg-l)}
.ncard.type-gov::before{background:var(--green-l)}
.ncard.type-rss::before{background:var(--amber-l)}
.ncard:hover{border-color:var(--border2);transform:translateX(3px)}
.ncard:hover::before,.ncard.search-match::before{opacity:1}
.ncard.search-match{border-color:rgba(59,130,246,.3);background:rgba(37,99,235,.05)}
.ncard.search-hidden{display:none}

.nc-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.nc-badge{
  font-size:9px;padding:2px 7px;border-radius:3px;font-weight:500;
  white-space:nowrap
}
.nb-news{background:rgba(59,130,246,.15);color:#93c5fd}
.nb-tg{background:var(--tg-dim);color:#7dd3fc}
.nb-gov{background:var(--green-dim);color:#6ee7b7}
.nb-rss{background:var(--amber-dim);color:#fcd34d}
.nc-source{font-size:10px;color:var(--muted)}
.nc-region{
  font-size:9px;padding:1px 6px;border-radius:3px;
  background:rgba(255,255,255,.05);color:var(--muted2)
}
.nc-time{margin-left:auto;font-size:10px;color:var(--muted2);white-space:nowrap}
.nc-title{font-size:13px;font-weight:500;line-height:1.5;margin-bottom:5px}
.nc-title mark{
  background:rgba(251,191,36,.25);color:#fde68a;
  border-radius:2px;padding:0 2px
}
.nc-summary{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:6px}
.nc-summary mark{
  background:rgba(251,191,36,.15);color:#fcd34d;
  border-radius:2px;padding:0 2px
}
.nc-rss-url{
  font-size:10px;color:var(--muted2);
  display:flex;align-items:center;gap:4px;margin-top:4px
}
.nc-rss-url a{color:var(--accent-xl);text-decoration:none}
.nc-rss-url a:hover{text-decoration:underline}

.empty-feed{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:200px;color:var(--muted);font-size:12px;gap:8px
}
.empty-icon{font-size:36px}

/* ─── RIGHT PANEL ────────────────────────────────────────── */
.right-panel{
  background:var(--bg2);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden
}
.rp-header{
  padding:12px 14px 10px;border-bottom:1px solid var(--border);
  flex-shrink:0
}
.rp-title{
  font-family:'Unbounded',sans-serif;
  font-size:10px;font-weight:600;letter-spacing:1px;
  color:var(--muted2);text-transform:uppercase;margin-bottom:10px
}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
.stat-b{
  background:var(--bg3);border-radius:var(--r-sm);
  padding:8px 10px
}
.stat-l{font-size:9px;color:var(--muted2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.stat-v{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:600}
.stat-s{font-size:9px;color:var(--muted2);margin-top:2px}
.stat-v.c-green{color:var(--green-l)}
.stat-v.c-blue{color:var(--accent-xl)}
.stat-v.c-amber{color:var(--amber-l)}

/* RSS ACCORDION */
.rp-body{flex:1;overflow-y:auto}
.rss-group{border-bottom:1px solid var(--border)}
.rss-group-head{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;cursor:pointer;
  font-size:11px;font-weight:500;
  transition:background .15s;user-select:none
}
.rss-group-head:hover{background:var(--bg3)}
.rgh-icon{font-size:13px}
.rgh-name{flex:1}
.rgh-count{
  font-size:9px;background:var(--bg4);
  padding:1px 6px;border-radius:10px;color:var(--muted)
}
.rgh-arrow{color:var(--muted2);font-size:11px;transition:transform .2s}
.rss-group.open .rgh-arrow{transform:rotate(90deg)}
.rss-group-body{display:none;padding:0 8px 8px}
.rss-group.open .rss-group-body{display:block}

.rss-entry{
  display:flex;align-items:center;gap:8px;
  padding:6px 8px;border-radius:var(--r-sm);
  font-size:11px;cursor:pointer;
  transition:background .15s;
}
.rss-entry:hover{background:var(--bg4)}
.re-icon{
  width:20px;height:20px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;flex-shrink:0
}
.rei-news{background:rgba(59,130,246,.2)}
.rei-tg{background:var(--tg-dim)}
.rei-gov{background:var(--green-dim)}
.re-info{flex:1;min-width:0}
.re-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.re-sub{font-size:9px;color:var(--muted2);margin-top:1px}
.re-toggle{
  width:26px;height:15px;border-radius:8px;
  border:1px solid var(--border2);background:var(--bg4);
  position:relative;cursor:pointer;transition:background .2s;flex-shrink:0
}
.re-toggle.on{background:var(--accent);border-color:var(--accent-l)}
.re-toggle::after{
  content:'';position:absolute;
  width:9px;height:9px;border-radius:50%;
  background:var(--muted);top:2px;left:2px;
  transition:all .2s
}
.re-toggle.on::after{left:13px;background:#fff}

/* TG LIVE FEED */
.tg-live-wrap{
  border-top:1px solid var(--border);
  flex-shrink:0
}
.tgl-head{
  padding:10px 14px 8px;
  font-size:10px;font-weight:500;color:var(--muted2);
  text-transform:uppercase;letter-spacing:.5px;
  display:flex;align-items:center;gap:6px
}
.tgl-items{max-height:200px;overflow-y:auto}
.tgl-item{
  padding:8px 14px;border-top:1px solid var(--border);
  font-size:11px;cursor:pointer;transition:background .15s
}
.tgl-item:hover{background:var(--bg3)}
.tgl-ch{color:var(--tg-l);font-size:10px;font-weight:500;margin-bottom:3px}
.tgl-text{color:var(--text);line-height:1.5;margin-bottom:3px}
.tgl-meta{color:var(--muted2);font-size:9px}

/* ─── SECTION LABEL ──────────────────────────────────────── */
.sec-label{
  font-size:9px;letter-spacing:1px;text-transform:uppercase;
  color:var(--muted2);padding:8px 9px 4px;font-weight:600
}

/* ─── PANEL TABS (right) ─────────────────────────────────── */
.rp-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.rp-tab{
  flex:1;padding:9px 0;text-align:center;
  font-size:10px;font-weight:500;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;transition:all .15s
}
.rp-tab.active{color:var(--accent-xl);border-bottom-color:var(--accent-l)}
.rp-tab:hover:not(.active){color:var(--text)}

.rp-pane{display:none}
.rp-pane.active{display:block}
</style>
</head>
<body>

<!-- ══════════════ HEADER ══════════════ -->
<header>
  <div class="logo">
    <span class="logo-flag">🇷🇺</span>
    Регионы<span class="logo-dot">·</span>РФ
  </div>

  <div class="global-search">
    <span class="search-ico">⌕</span>
    <input id="gsearch" type="text" placeholder="Поиск по новостям, регионам, источникам…"
           oninput="onGlobalSearch(this.value)" onkeydown="onSearchKey(event)">
    <span class="search-clear" id="sclear" onclick="clearSearch()">✕</span>
  </div>

  <div class="search-tags" id="search-tags">
    <button class="stag" onclick="quickSearch('бюджет')">бюджет</button>
    <button class="stag" onclick="quickSearch('инфраструктура')">инфраструктура</button>
    <button class="stag" onclick="quickSearch('экология')">экология</button>
    <button class="stag" onclick="quickSearch('ЖКХ')">ЖКХ</button>
    <button class="stag" onclick="quickSearch('инвестиции')">инвестиции</button>
  </div>

  <div class="header-right">
    <div class="live-pill"><div class="ldot"></div>Онлайн</div>
    <span id="hclock"></span>
  </div>
</header>

<!-- ══════════════ SEARCH BAR ══════════════ -->
<div id="search-bar">
  Поиск: <span class="sq-tag" id="sq-label"></span>
  <span id="search-stats"></span>
  <button class="stag" onclick="clearSearch()" style="margin-left:6px">✕ Сбросить</button>
</div>

<!-- ══════════════ MAIN ══════════════ -->
<div class="main">

  <!-- ─── LEFT ─── -->
  <div class="left-panel">
    <div class="lp-tabs">
      <div class="lp-tab active" onclick="switchLTab('districts',this)">Округа</div>
      <div class="lp-tab" onclick="switchLTab('regions',this)">Регионы</div>
    </div>
    <div class="lp-body">
      <div class="reg-search">
        <span class="reg-search-ico">⌕</span>
        <input id="regsearch" type="text" placeholder="Найти регион…" oninput="filterRegions(this.value)">
      </div>
      <div id="districts-panel"></div>
      <div id="regions-panel" style="display:none"></div>
    </div>
  </div>

  <!-- ─── CENTER ─── -->

function switchLTab(tab, el){
  state.leftTab = tab;
  document.querySelectorAll('.lp-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('districts-panel').style.display = tab==='districts'?'block':'none';
  document.getElementById('regions-panel').style.display  = tab==='regions'?'block':'none';
}

function renderDistricts(){
  const el = document.getElementById('districts-panel');
  el.innerHTML = DISTRICTS.map(d=>{
    const cnt = REGIONS.filter(r=>r.d===d.id).length;
    return `<div class="district-btn ${state.selDistrict===d.id?'active':''}"
      onclick="selDistrict('${d.id}')">
      <div class="d-swatch" style="background:${d.color}"></div>
      <span class="d-name">${d.name}</span>
      <span class="d-count">${cnt}</span>
    </div>`;
  }).join('');
}

function selDistrict(id){
  state.selDistrict = state.selDistrict===id ? null : id;
  state.selRegion = null;
  renderDistricts();
  renderRegionsList();
  renderNewsFeed();
  renderRightPanel();
  renderMap();
  document.getElementById('news-title').textContent =
    state.selDistrict ? DISTRICTS.find(d=>d.id===state.selDistrict)?.name : 'Все регионы';
}

function renderRegionsList(filter=''){
  const el = document.getElementById('regions-panel');
  let list = REGIONS;
  if(state.selDistrict) list = list.filter(r=>r.d===state.selDistrict);
  if(filter) list = list.filter(r=>r.name.toLowerCase().includes(filter.toLowerCase()));

  el.innerHTML = DISTRICTS.map(d=>{
    const dRegs = list.filter(r=>r.d===d.id);
    if(!dRegs.length) return '';
    return `<div class="sec-label" style="color:${d.color}88">${d.short}</div>` +
      dRegs.map(r=>{
        const cnt = MOCK_NEWS.filter(n=>n.rid===r.id).length;
        return `<div class="region-btn ${state.selRegion===r.id?'active':''}" onclick="selRegion('${r.id}')">
          <div class="rb-dot"></div>
          <span class="rb-name">${r.name}</span>
          ${cnt?`<span class="rb-news has-news">${cnt}</span>`:
                `<span class="rb-news">—</span>`}
        </div>`;
      }).join('');
  }).join('');
}

function filterRegions(q){
  renderRegionsList(q);
}

function selRegion(id){
  state.selRegion = state.selRegion===id ? null : id;
  state.selDistrict = null;
  renderDistricts();
  renderRegionsList();
  renderNewsFeed();
  renderRightPanel();
  renderMap();
  const r = REGIONS.find(x=>x.id===id);
  document.getElementById('news-title').textContent = r ? r.name : 'Все регионы';
}

═══════════════════════════════════════════════════════════ */
function getDistrictColor(did){
  return DISTRICTS.find(d=>d.id===did)?.color || '#3b82f6';
}

function renderMap(){
  const g = document.getElementById('map-g');
  const hasNews = new Set(MOCK_NEWS.map(n=>n.rid));
  g.innerHTML = REGIONS.map(r=>{
    const isSel = state.selRegion===r.id;
    const isDistSel = state.selDistrict===r.d;
    const hasN = hasNews.has(r.id);
    const dc = getDistrictColor(r.d);
    let fill = '#12213a';
    if(isSel) fill='#1d4ed8';
    else if(isDistSel) fill='#1e3d7a';
    else if(hasN) fill='#16305a';
    const stroke = isSel ? '#60a5fa' : isDistSel ? '#3b7de0' : '#1e3050';
    const sw = isSel ? .8 : isDistSel ? .5 : .3;
    const x=r.cx-r.w/2, y=r.cy-r.h/2;
    const srcCount = (REGION_SOURCES[r.id]||[]).length;
    return `<g data-rid="${r.id}">
      <rect x="${x}" y="${y}" width="${r.w}" height="${r.h}" rx="2"
        fill="${fill}" stroke="${stroke}" stroke-width="${sw}"
        class="map-region ${isSel?'mr-active':''} ${hasN?'mr-hasnews':''}"
        onmouseenter="showTT(event,'${r.id}')"
        onmouseleave="hideTT()"
        onclick="selRegion('${r.id}')"
      />
      ${r.w>=24?`<text x="${r.cx}" y="${r.cy+3}" text-anchor="middle"
        font-size="${r.w>=50?8:7}" fill="${isSel?'#93c5fd':'#4a6080'}"
        pointer-events="none" font-family="Golos Text,sans-serif"
        >${r.name.split(' ')[0].slice(0,9)}</text>`:''}
    </g>`;
  }).join('');
}

function mapMode(m, btn){
  document.querySelectorAll('.mc-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function showTT(e, rid){
  const r = REGIONS.find(x=>x.id===rid);
  if(!r) return;
  const d = DISTRICTS.find(x=>x.id===r.d);
  const cnt = MOCK_NEWS.filter(n=>n.rid===rid).length;
  const srcs = (REGION_SOURCES[rid]||[]).length;
  const tt = document.getElementById('mtooltip');
  document.getElementById('mtt-name').textContent = r.name;
  document.getElementById('mtt-district').textContent = d?.name||'';
  document.getElementById('mtt-sources').textContent =
    `${srcs} источников · ${cnt} новостей за 24ч`;
  const svg = document.getElementById('map-svg');
  const rect = svg.getBoundingClientRect();
  let lx = e.clientX - rect.left + 12;
  let ly = e.clientY - rect.top - 8;
  if(lx+200>rect.width) lx -= 210;
  tt.style.left = lx+'px';
  tt.style.top  = ly+'px';
  tt.style.display = 'block';
}
function hideTT(){ document.getElementById('mtooltip').style.display='none'; }

/* ═══════════════════════════════════════════════════════════
   NEWS FEED
═══════════════════════════════════════════════════════════ */
function setNFilter(f, btn){
  state.newsFilter = f;
  document.querySelectorAll('.nf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderNewsFeed();
}

function highlight(text, query){
  if(!query) return text;
  const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function renderNewsFeed(){
  const el = document.getElementById('news-list');
  const q = state.searchQuery.toLowerCase().trim();

  let news = [...MOCK_NEWS];

  // region/district filter
  if(state.selRegion){
    news = news.filter(n=>n.rid===state.selRegion);
  } else if(state.selDistrict){
    const ids = new Set(REGIONS.filter(r=>r.d===state.selDistrict).map(r=>r.id));
    news = news.filter(n=>ids.has(n.rid));
  }

  // type filter
  if(state.newsFilter!=='all'){
    news = news.filter(n=>n.t===state.newsFilter);
  }

  // keyword search
  if(q){
    news = news.map(n=>{
      const inTitle   = n.title.toLowerCase().includes(q);
      const inSummary = n.sum.toLowerCase().includes(q);
      const inSource  = n.src.toLowerCase().includes(q);
      const inRegion  = (REGIONS.find(r=>r.id===n.rid)?.name||'').toLowerCase().includes(q);
      return {...n, _match: inTitle||inSummary||inSource||inRegion};
    });
    // sort matches first
    news.sort((a,b)=>(b._match?1:0)-(a._match?1:0));
  }

  if(!news.length){
    el.innerHTML = `<div class="empty-feed"><div class="empty-icon">📭</div>Нет новостей по фильтру</div>`;
    return;
  }

  const matchCount = q ? news.filter(n=>n._match).length : news.length;
  if(q){
    document.getElementById('sq-label').textContent = `«${state.searchQuery}»`;
    document.getElementById('search-stats').textContent =
      `${matchCount} совпадений из ${MOCK_NEWS.length}`;
  }

  el.innerHTML = news.map(n=>{
    const region = REGIONS.find(r=>r.id===n.rid);
    const isHidden = q && !n._match;
    const badgeMap = {news:'nb-news СМИ', tg:'nb-tg Telegram', gov:'nb-gov Гос.орган', rss:'nb-rss RSS'};
    const [bc, bt] = (badgeMap[n.t]||'nb-news СМИ').split(' ');
    const titleHl  = q ? highlight(n.title, state.searchQuery) : n.title;
    const sumHl    = q ? highlight(n.sum,   state.searchQuery) : n.sum;
    const rss = (REGION_SOURCES[n.rid]||[]).find(s=>s.n===n.src);
    return `<div class="ncard type-${n.t} ${q&&n._match?'search-match':''} ${isHidden?'search-hidden':''}">
      <div class="nc-top">
        <span class="nc-badge ${bc}">${bt}</span>
        <span class="nc-source">${n.src}</span>
        ${region?`<span class="nc-region">${region.name}</span>`:''}
        <span class="nc-time">${n.time} назад</span>
      </div>
      <div class="nc-title">${titleHl}</div>
      <div class="nc-summary">${sumHl}</div>
      ${rss?`<div class="nc-rss-url">📡 RSS: <a href="${rss.u}" target="_blank">${rss.u.replace('https://','')}</a></div>`:''}
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════
   SEARCH
═══════════════════════════════════════════════════════════ */
let searchTimer = null;

function onGlobalSearch(val){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    state.searchQuery = val.trim();
    document.getElementById('sclear').style.display = val ? 'block' : 'none';

    const bar = document.getElementById('search-bar');
    if(val.trim()){
      bar.classList.add('visible');
      document.getElementById('sq-label').textContent = `«${val.trim()}»`;
    } else {
      bar.classList.remove('visible');
    }

    // update active tag
    document.querySelectorAll('.stag').forEach(t=>{
      t.classList.toggle('active', t.textContent===val.trim());
    });

    renderNewsFeed();
  }, 180);
}

function onSearchKey(e){
  if(e.key==='Escape') clearSearch();
}

function quickSearch(term){
  const inp = document.getElementById('gsearch');
  inp.value = term;
  onGlobalSearch(term);
}

function clearSearch(){
  const inp = document.getElementById('gsearch');
  inp.value = '';
  state.searchQuery = '';
  document.getElementById('sclear').style.display='none';
  document.getElementById('search-bar').classList.remove('visible');
  document.querySelectorAll('.stag').forEach(t=>t.classList.remove('active'));
  renderNewsFeed();
}

═══════════════════════════════════════════════════════════ */
function switchRTab(tab, el){
  state.rightTab = tab;
  document.querySelectorAll('.rp-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.rp-pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('rp-'+tab).classList.add('active');
}

function renderRightPanel(){
  const el = document.getElementById('rp-sources');

  // if region selected, show its sources
  if(state.selRegion){
    const r = REGIONS.find(x=>x.id===state.selRegion);
    const srcs = REGION_SOURCES[state.selRegion]||[];
    const byType = {news:[], tg:[], gov:[]};
    srcs.forEach(s=>{ if(byType[s.t]) byType[s.t].push(s); });

    el.innerHTML = `<div style="padding:10px 14px;border-bottom:1px solid var(--border)">
      <div style="font-size:11px;font-weight:600;margin-bottom:2px">${r.name}</div>
      <div style="font-size:10px;color:var(--muted2)">${srcs.length} источников в регионе</div>
    </div>` + renderSourceGroup('📰 СМИ', byType.news, 'news')
             + renderSourceGroup('🏛 Госорганы', byType.gov, 'gov')
             + renderSourceGroup('✈️ Telegram', byType.tg, 'tg')
             + renderFederalGroups();
    return;
  }

  el.innerHTML = renderFederalGroups();
  initToggles();
}

function renderSourceGroup(label, items, type){
  if(!items.length) return '';
  const icons = {news:'📰',tg:'✈️',gov:'🏛'};
  const iclass = {news:'rei-news',tg:'rei-tg',gov:'rei-gov'};
  return `<div class="rss-group open">
    <div class="rss-group-head" onclick="this.parentElement.classList.toggle('open')">
      <span class="rgh-icon">${icons[type]||'📡'}</span>
      <span class="rgh-name">${label}</span>
      <span class="rgh-count">${items.length}</span>
      <span class="rgh-arrow">›</span>
    </div>
    <div class="rss-group-body">
      ${items.map(s=>{
        const url = s.u || (s.ch ? `https://t.me/${s.ch.replace('@','')}` : '#');
        return `<div class="rss-entry" onclick="window.open('${url}','_blank')">
          <div class="re-icon ${iclass[type]}">${icons[type]}</div>
          <div class="re-info">
            <div class="re-name">${s.n}</div>
            <div class="re-sub">${s.ch||s.u?.replace('https://','').split('/')[0]||''}</div>
          </div>
          <div class="re-toggle on" onclick="event.stopPropagation();this.classList.toggle('on')"></div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderFederalGroups(){
  const smi = FEDERAL_SOURCES.smi.map(s=>({n:s.n,t:'news',u:s.u}));
  const gov = FEDERAL_SOURCES.gov.map(s=>({n:s.n,t:'gov',u:s.u}));
  const tg  = FEDERAL_SOURCES.tg.map(s=>({n:s.n,t:'tg',ch:s.ch}));
  return `<div style="padding:8px 14px 4px;font-size:9px;letter-spacing:.8px;color:var(--muted2);text-transform:uppercase">Федеральные</div>`
    + renderSourceGroup('📰 Федеральные СМИ', smi, 'news')
    + renderSourceGroup('🏛 Госведомства РФ', gov, 'gov')
    + renderSourceGroup('✈️ Telegram-каналы', tg, 'tg');
}

  let totalSrcs = FEDERAL_SOURCES.smi.length + FEDERAL_SOURCES.gov.length + FEDERAL_SOURCES.tg.length;
  Object.values(REGION_SOURCES).forEach(arr=>{ totalSrcs += arr.length; });
