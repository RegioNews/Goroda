<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регионы России — Новостной мониторинг</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ─────────────────────────────────────────────── */
:root{
  --bg:#080d18; --bg2:#0f1624; --bg3:#161f30; --bg4:#1c2840;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13); --border3:rgba(255,255,255,.22);
  --accent:#2563eb; --accent-l:#3b82f6; --accent-xl:#60a5fa; --accent-dim:rgba(37,99,235,.15);
  --green:#059669; --green-l:#10b981; --green-dim:rgba(5,150,105,.12);
  --amber:#d97706; --amber-l:#f59e0b; --amber-dim:rgba(217,119,6,.12);
  --red:#dc2626; --red-l:#ef4444; --red-dim:rgba(220,38,38,.12);
  --tg:#0088cc; --tg-l:#2ea6ff; --tg-dim:rgba(0,136,204,.12);
  --purple:#7c3aed; --purple-l:#a78bfa; --purple-dim:rgba(124,58,237,.12);
  --pink:#be185d; --pink-l:#f472b6; --pink-dim:rgba(190,24,93,.12);
  --text:#e8edf5; --muted:#7a8ba8; --muted2:#4a5568;
  --header-bg:rgba(8,13,24,.95);
  --map-base:#12213a; --map-news:#16305a; --map-sel:#1d4ed8; --map-stroke:#1e3050;
  --card-link:#60a5fa;
  --r:10px; --r-sm:6px;
  color-scheme: dark;
}
[data-theme="light"]{
  --bg:#f0f4fa; --bg2:#ffffff; --bg3:#e8eef7; --bg4:#dce5f0;
  --border:rgba(0,0,0,.08); --border2:rgba(0,0,0,.14); --border3:rgba(0,0,0,.22);
  --accent:#1d4ed8; --accent-l:#2563eb; --accent-xl:#1e40af; --accent-dim:rgba(29,78,216,.1);
  --green:#065f46; --green-l:#059669; --green-dim:rgba(6,95,70,.1);
  --amber:#92400e; --amber-l:#b45309; --amber-dim:rgba(146,64,14,.1);
  --red:#991b1b; --red-l:#dc2626; --red-dim:rgba(153,27,27,.1);
  --tg:#0055aa; --tg-l:#0077cc; --tg-dim:rgba(0,85,170,.1);
  --purple:#5b21b6; --purple-l:#7c3aed; --purple-dim:rgba(91,33,182,.1);
  --pink:#9d174d; --pink-l:#be185d; --pink-dim:rgba(157,23,77,.1);
  --text:#1a2335; --muted:#4a5568; --muted2:#8696b0;
  --header-bg:rgba(240,244,250,.97);
  --map-base:#c5d5ea; --map-news:#93b4d8; --map-sel:#2563eb; --map-stroke:#9fb8d8;
  --card-link:#1d4ed8;
  color-scheme: light;
}

/* ── BASE ─────────────────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:14px}
body{font-family:'Golos Text',sans-serif;background:var(--bg);color:var(--text);
  height:100vh;overflow:hidden;display:flex;flex-direction:column;transition:background .25s,color .25s}

/* ── HEADER ──────────────────────────────────────────── */
header{
  position:relative;z-index:100;
  display:flex;align-items:center;gap:16px;
  padding:0 16px;height:52px;
  background:var(--header-bg);
  border-bottom:1px solid var(--border2);
  backdrop-filter:blur(20px);flex-shrink:0;
}
.logo{font-family:'Unbounded',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:-.3px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.logo-dot{color:var(--accent-l);margin:0 1px}

/* TOPIC FILTER BAR */
.topic-bar{display:flex;align-items:center;gap:5px;flex:1;overflow-x:auto;scrollbar-width:none}
.topic-bar::-webkit-scrollbar{display:none}
.tbtn{
  display:flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:20px;border:1px solid var(--border2);
  background:transparent;color:var(--muted);font-size:11px;cursor:pointer;
  font-family:inherit;white-space:nowrap;transition:all .15s;flex-shrink:0
}
.tbtn:hover{border-color:var(--accent-l);color:var(--text)}
.tbtn.active{border-color:var(--accent-l);background:var(--accent-dim);color:var(--accent-xl)}
.tbtn .ti{font-size:12px}

/* GLOBAL SEARCH */
.gsearch{position:relative;width:220px;flex-shrink:0}
.gsearch input{
  width:100%;height:32px;background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--r-sm);padding:0 30px 0 32px;
  color:var(--text);font-family:inherit;font-size:12px;outline:none;
  transition:border-color .2s,box-shadow .2s
}
.gsearch input:focus{border-color:var(--accent-l);box-shadow:0 0 0 3px var(--accent-dim)}
.gsearch input::placeholder{color:var(--muted2)}
.gs-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.gs-clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  color:var(--muted2);cursor:pointer;font-size:14px;display:none;line-height:1;transition:color .15s}
.gs-clr:hover{color:var(--text)}

/* HEADER RIGHT */
.hright{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.live-pill{display:flex;align-items:center;gap:5px;background:var(--green-dim);
  border:1px solid rgba(16,185,129,.25);color:var(--green-l);
  padding:3px 9px;border-radius:20px;font-size:10px;font-weight:500}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--green-l);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
#hclock{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* THEME TOGGLE */
.theme-btn{
  width:52px;height:26px;border-radius:13px;
  background:var(--bg4);border:1px solid var(--border2);
  position:relative;cursor:pointer;transition:background .25s;flex-shrink:0
}
[data-theme="light"] .theme-btn{background:var(--accent-dim);border-color:var(--accent-l)}
.theme-btn-track{
  position:absolute;top:3px;left:3px;
  display:flex;align-items:center;justify-content:center;
  width:18px;height:18px;border-radius:50%;
  background:var(--muted);font-size:11px;
  transition:all .25s;
}
[data-theme="light"] .theme-btn-track{left:27px;background:var(--accent-l)}
.theme-btn-track::after{content:'🌙'}
[data-theme="light"] .theme-btn-track::after{content:'☀️'}

/* ── SEARCH STATUS BAR ─────────────────────────────── */
#sbar{
  display:none;background:var(--bg2);border-bottom:1px solid var(--border2);
  padding:5px 16px;align-items:center;gap:8px;font-size:11px;color:var(--muted);
  flex-shrink:0;z-index:90
}
#sbar.vis{display:flex}
.sq{background:var(--accent-dim);border:1px solid rgba(59,130,246,.3);
  color:var(--accent-xl);padding:1px 7px;border-radius:4px;font-weight:500}
#sstat{margin-left:auto;color:var(--muted2)}
.sbar-clr{cursor:pointer;color:var(--red-l);font-size:10px;padding:2px 7px;
  border:1px solid var(--red-dim);border-radius:4px;transition:all .15s}
.sbar-clr:hover{background:var(--red-dim)}

/* ── MAIN GRID ──────────────────────────────────────── */
.main{flex:1;overflow:hidden;display:grid;grid-template-columns:256px 1fr 288px;position:relative;z-index:1}

/* SCROLLBARS */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── LEFT PANEL ────────────────────────────────────── */
.left{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.lptabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.lptab{flex:1;padding:9px 0;text-align:center;font-size:10px;font-weight:500;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.lptab.active{color:var(--accent-xl);border-bottom-color:var(--accent-l)}
.lptab:hover:not(.active){color:var(--text)}
.lpbody{flex:1;overflow-y:auto;padding:8px}

.rsearch{position:relative;margin-bottom:8px}
.rsearch input{width:100%;height:28px;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:0 8px 0 26px;color:var(--text);font-family:inherit;font-size:11px;outline:none;transition:border-color .2s}
.rsearch input:focus{border-color:var(--accent-l)}
.rsearch input::placeholder{color:var(--muted2)}
.rsi{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:12px;pointer-events:none}

.ditem{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:var(--r-sm);
  cursor:pointer;transition:background .15s;margin-bottom:1px}
.ditem:hover{background:var(--bg4)}
.ditem.active{background:var(--accent-dim);border:1px solid rgba(59,130,246,.2)}
.dsw{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dn{font-size:11px;flex:1}
.dc{font-size:9px;color:var(--muted2);background:var(--bg4);padding:1px 5px;border-radius:10px}

.ritem{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:var(--r-sm);
  cursor:pointer;transition:background .15s;font-size:11px}
.ritem:hover{background:var(--bg3)}
.ritem.active{background:var(--accent-dim);color:var(--accent-xl)}
.rdot{width:5px;height:5px;border-radius:50%;background:var(--muted2);flex-shrink:0}
.ritem.active .rdot{background:var(--accent-l)}
.rn{flex:1;line-height:1.3}
.rcnt{font-size:9px;color:var(--muted2)}
.rcnt.has{color:var(--accent-xl)}
.sec-lbl{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);
  padding:7px 8px 3px;font-weight:600}

/* ── CENTER ─────────────────────────────────────────── */
.center{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* MAP */
.mapwrap{flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--border);
  position:relative;height:272px;overflow:hidden}
#msvg{width:100%;height:100%;display:block}
.mr{fill:var(--map-base);stroke:var(--map-stroke);stroke-width:.4;cursor:pointer;transition:fill .18s}
.mr:hover{fill:var(--map-news);stroke:var(--accent-l)}
.mr.sel{fill:var(--map-sel);stroke:var(--accent-xl);stroke-width:.8}
.mr.hasnews{fill:var(--map-news)}

.mctrl{position:absolute;top:8px;left:8px;display:flex;gap:5px;flex-wrap:wrap}
.mcbtn{background:var(--header-bg);border:1px solid var(--border2);color:var(--muted);
  font-size:9px;padding:3px 8px;border-radius:20px;cursor:pointer;backdrop-filter:blur(8px);
  transition:all .15s;font-family:inherit}
.mcbtn:hover,.mcbtn.active{background:var(--accent-dim);border-color:var(--accent-l);color:var(--accent-xl)}

.mleg{position:absolute;bottom:8px;right:8px;background:var(--header-bg);
  border:1px solid var(--border2);border-radius:var(--r-sm);padding:7px 9px;font-size:9px;
  backdrop-filter:blur(10px)}
.mlr{display:flex;align-items:center;gap:5px;color:var(--muted);margin-bottom:3px}
.mlr:last-child{margin-bottom:0}
.mlsw{width:9px;height:9px;border-radius:2px;flex-shrink:0}

#mtt{position:absolute;background:var(--header-bg);border:1px solid var(--border2);
  border-radius:var(--r-sm);padding:6px 10px;font-size:10px;pointer-events:none;
  display:none;z-index:50;backdrop-filter:blur(12px);max-width:210px;line-height:1.5}
#mtt-n{font-weight:600;margin-bottom:1px;color:var(--text)}
#mtt-d{color:var(--muted);font-size:9px;margin-bottom:3px}
#mtt-s{color:var(--muted)}

/* NEWS AREA */
.news-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ntoolbar{display:flex;align-items:center;gap:6px;padding:8px 12px;
  border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.ntitle{font-family:'Unbounded',sans-serif;font-size:11px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.nfilters{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nfbtn{padding:2px 8px;border-radius:20px;border:1px solid var(--border);background:transparent;
  color:var(--muted);font-size:9px;cursor:pointer;font-family:inherit;transition:all .15s}
.nfbtn:hover{border-color:var(--border3);color:var(--text)}
.nfbtn.active{background:var(--accent-dim);border-color:var(--accent-l);color:var(--accent-xl)}

#nlist{flex:1;overflow-y:auto;padding:10px 12px}

/* NEWS CARD */
.ncard{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:11px 13px;margin-bottom:8px;position:relative;overflow:hidden;
  transition:border-color .15s,transform .15s,box-shadow .15s
}
.ncard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2.5px;
  background:var(--accent-l);opacity:0;transition:opacity .15s}
.ncard.type-tg::before{background:var(--tg-l)}
.ncard.type-gov::before{background:var(--green-l)}
.ncard.type-gov2::before{background:var(--amber-l)}
.ncard.type-emerg::before{background:var(--red-l)}
.ncard.type-sport::before{background:var(--purple-l)}
.ncard.type-culture::before{background:var(--pink-l)}
.ncard:hover{border-color:var(--border2);transform:translateX(3px)}
.ncard:hover::before,.ncard.smatch::before{opacity:1}
.ncard.smatch{border-color:rgba(59,130,246,.3);background:rgba(37,99,235,.04)}
.ncard.shide{display:none}

.nctop{display:flex;align-items:center;gap:5px;margin-bottom:5px;flex-wrap:wrap}
.badge{font-size:9px;padding:2px 7px;border-radius:3px;font-weight:500;white-space:nowrap}
.bn{background:rgba(59,130,246,.15);color:#93c5fd}
.btg{background:var(--tg-dim);color:#7dd3fc}
.bgov{background:var(--green-dim);color:#6ee7b7}
.bgov2{background:var(--amber-dim);color:#fcd34d}
.bemerg{background:var(--red-dim);color:#fca5a5}
.bsport{background:var(--purple-dim);color:#c4b5fd}
.bcult{background:var(--pink-dim);color:#f9a8d4}
.bguber{background:rgba(20,184,166,.15);color:#5eead4}

[data-theme="light"] .bn{background:rgba(29,78,216,.12);color:#1e40af}
[data-theme="light"] .btg{background:rgba(0,119,204,.12);color:#0077cc}
[data-theme="light"] .bgov{background:rgba(5,150,105,.12);color:#065f46}
[data-theme="light"] .bgov2{background:rgba(180,83,9,.12);color:#92400e}
[data-theme="light"] .bemerg{background:rgba(220,38,38,.1);color:#991b1b}
[data-theme="light"] .bsport{background:rgba(124,58,237,.1);color:#5b21b6}
[data-theme="light"] .bcult{background:rgba(190,24,93,.1);color:#9d174d}
[data-theme="light"] .bguber{background:rgba(13,148,136,.1);color:#0f766e}

.nsrc{font-size:10px;color:var(--muted)}
.nreg{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--bg4);color:var(--muted2)}
.ntime{margin-left:auto;font-size:10px;color:var(--muted2);white-space:nowrap}

/* CLICKABLE TITLE */
.ntitle-link{
  display:block;font-size:13px;font-weight:500;line-height:1.5;margin-bottom:4px;
  color:var(--text);text-decoration:none;transition:color .15s
}
.ntitle-link:hover{color:var(--card-link);text-decoration:underline}
.ntitle-link mark{background:rgba(251,191,36,.25);color:#fde68a;border-radius:2px;padding:0 2px}
[data-theme="light"] .ntitle-link mark{background:rgba(217,119,6,.2);color:#92400e}

.nsum{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:5px}
.nsum mark{background:rgba(251,191,36,.15);color:#fcd34d;border-radius:2px;padding:0 2px}
[data-theme="light"] .nsum mark{background:rgba(217,119,6,.15);color:#92400e}

.nfooter{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nlink{
  font-size:10px;color:var(--card-link);text-decoration:none;
  display:inline-flex;align-items:center;gap:3px;
  border:1px solid transparent;border-radius:4px;padding:2px 7px;
  transition:all .15s;background:var(--accent-dim)
}
.nlink:hover{border-color:var(--accent-l);text-decoration:none}
.nrss{font-size:9px;color:var(--muted2)}
.nrss a{color:var(--muted);text-decoration:none}
.nrss a:hover{color:var(--accent-xl);text-decoration:underline}
.ntags{display:flex;gap:4px;flex-wrap:wrap}
.ntag{font-size:9px;padding:1px 6px;border-radius:20px;
  background:var(--bg3);color:var(--muted2);cursor:pointer;transition:all .15s}
.ntag:hover{background:var(--accent-dim);color:var(--accent-xl)}

.empty-feed{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:180px;color:var(--muted);font-size:12px;gap:8px}

/* ── RIGHT PANEL ─────────────────────────────────────── */
.right{background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.rphead{padding:10px 12px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.rptitle{font-family:'Unbounded',sans-serif;font-size:9px;font-weight:600;
  letter-spacing:1px;color:var(--muted2);text-transform:uppercase;margin-bottom:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:0}
.sb{background:var(--bg3);border-radius:var(--r-sm);padding:7px 9px}
.sl{font-size:8px;color:var(--muted2);margin-bottom:2px;text-transform:uppercase;letter-spacing:.4px}
.sv{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600}
.ss{font-size:8px;color:var(--muted2);margin-top:1px}
.sv.cg{color:var(--green-l)} .sv.cb{color:var(--accent-xl)} .sv.ca{color:var(--amber-l)}

.rptabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.rptab{flex:1;padding:8px 0;text-align:center;font-size:10px;font-weight:500;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.rptab.active{color:var(--accent-xl);border-bottom-color:var(--accent-l)}
.rpbody{flex:1;overflow-y:auto}
.rppane{display:none}
.rppane.active{display:block}

/* ACCORDION */
.rgrp{border-bottom:1px solid var(--border)}
.rgrph{display:flex;align-items:center;gap:7px;padding:9px 12px;cursor:pointer;
  font-size:11px;font-weight:500;transition:background .15s;user-select:none}
.rgrph:hover{background:var(--bg3)}
.rgi{font-size:12px}
.rgn{flex:1}
.rgc{font-size:9px;background:var(--bg4);padding:1px 5px;border-radius:10px;color:var(--muted)}
.rga{color:var(--muted2);font-size:10px;transition:transform .2s}
.rgrp.open .rga{transform:rotate(90deg)}
.rgrpb{display:none;padding:0 6px 6px}
.rgrp.open .rgrpb{display:block}

.rent{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:var(--r-sm);
  font-size:10px;cursor:pointer;transition:background .15s}
.rent:hover{background:var(--bg4)}
.reico{width:18px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.rei-n{background:rgba(59,130,246,.2)} .rei-t{background:var(--tg-dim)} .rei-g{background:var(--green-dim)}
.rei-s{background:var(--purple-dim)} .rei-c{background:var(--pink-dim)} .rei-e{background:var(--red-dim)}
.rein{flex:1;min-width:0}
.renn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rets{font-size:8px;color:var(--muted2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtog{width:24px;height:14px;border-radius:7px;border:1px solid var(--border2);background:var(--bg4);
  position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.rtog.on{background:var(--accent);border-color:var(--accent-l)}
.rtog::after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;
  background:var(--muted);top:2px;left:2px;transition:all .2s}
.rtog.on::after{left:12px;background:#fff}

/* TG FEED */
.tgi{padding:8px 12px;border-top:1px solid var(--border);font-size:11px;cursor:pointer;transition:background .15s}
.tgi:hover{background:var(--bg3)}
.tgch{color:var(--tg-l);font-size:10px;font-weight:500;margin-bottom:2px}
.tgtx{color:var(--text);line-height:1.5;margin-bottom:2px}
.tglink{font-size:10px;color:var(--card-link);text-decoration:none;display:inline-block;margin-bottom:2px}
.tglink:hover{text-decoration:underline}
.tgmt{color:var(--muted2);font-size:9px}

/* GUBER FEED */
.gubi{padding:9px 12px;border-top:1px solid var(--border);cursor:pointer;transition:background .15s}
.gubi:hover{background:var(--bg3)}

          <span class="rn">${r.n}</span>

  }).join('');
}

function renderMap(){
  const hasN=new Set(NEWS.map(n=>n.rid));
  document.getElementById('mg').innerHTML=REG.map(r=>{
    const isSel=S.selReg===r.id;
    const isDSel=S.selDist===r.d;
    const hasn=hasN.has(r.id);
    const x=r.cx-r.w/2, y=r.cy-r.h/2;
    let fill=hasn?'var(--map-news)':'var(--map-base)';
    if(isSel) fill='var(--map-sel)';
    else if(isDSel) fill='var(--map-news)';
    const stroke=isSel?'var(--accent-xl)':'var(--map-stroke)';
    const sw=isSel?.8:.3;
    return`<g>
      <rect x="${x}" y="${y}" width="${r.w}" height="${r.h}" rx="2"
        fill="${fill}" stroke="${stroke}" stroke-width="${sw}" class="mr ${isSel?'sel':''} ${hasn?'hasnews':''}"
        onmouseenter="showTT(event,'${r.id}')" onmouseleave="hideTT()" onclick="selReg('${r.id}')"/>
      ${r.w>=26?`<text x="${r.cx}" y="${r.cy+3.5}" text-anchor="middle"
        font-size="${r.w>=55?8:7}" fill="${isSel?'#dbeafe':'var(--muted2)'}"
        pointer-events="none" font-family="Golos Text,sans-serif">${r.n.split(' ')[0].slice(0,9)}</text>`:''}
    </g>`;
  }).join('');
}

}

function hl(txt,q){
  if(!q) return txt;
  const re=new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})','gi`);
  return txt.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),'<mark>$1</mark>');
}

const BADGE={
  news:  {cls:'bn',  label:'СМИ'},
  tg:    {cls:'btg', label:'Telegram'},
  gov:   {cls:'bgov',label:'Гос.орган'},
  gov2:  {cls:'bgov2',label:'Исп.власть'},
  emerg: {cls:'bemerg',label:'МЧС/ЧП'},

  guber: {cls:'bguber',label:'Губернатор'},
};

// news type → badge
function typeBadge(t){
  return BADGE[t]||BADGE.news;
}

// topic → type hint
function topicBadge(topic){
  return BADGE[topic]||null;
}

function renderNews(){
  const el=document.getElementById('nlist');
  const q=S.q.trim().toLowerCase();
  let news=[...NEWS];

  // region / district
  if(S.selReg) news=news.filter(n=>n.rid===S.selReg);
  else if(S.selDist){
    const ids=new Set(REG.filter(r=>r.d===S.selDist).map(r=>r.id));
    news=news.filter(n=>ids.has(n.rid));
  }

  // type filter (tab)
  if(S.nf!=='all'){
    if(S.nf==='gov') news=news.filter(n=>n.t==='gov'||n.t==='gov2');
    else if(S.nf==='guber') news=news.filter(n=>n.topic==='guber');
    else if(S.nf==='emerg') news=news.filter(n=>n.topic==='emerg'||n.t==='emerg');
    else if(S.nf==='sport') news=news.filter(n=>n.topic==='sport'||n.t==='sport');
    else if(S.nf==='culture') news=news.filter(n=>n.topic==='culture'||n.t==='culture');
    else news=news.filter(n=>n.t===S.nf);
  }

  // topic filter (top bar)
  if(S.topic!=='all'){
    const tops=TOPIC_MAP[S.topic];
    if(tops) news=news.filter(n=>tops.includes(n.topic)||tops.includes(n.t));
  }

  // keyword search
  if(q){
    news=news.map(n=>{
      const reg=REG.find(r=>r.id===n.rid)?.n||'';
      const _m=n.title.toLowerCase().includes(q)||
               n.sum.toLowerCase().includes(q)||
               n.src.toLowerCase().includes(q)||
               reg.toLowerCase().includes(q)||
               (n.tags||[]).some(tag=>tag.toLowerCase().includes(q));
      return{...n,_m};
    });
    news.sort((a,b)=>(b._m?1:0)-(a._m?1:0));
    const mc=news.filter(n=>n._m).length;
    document.getElementById('sq').textContent=`«${S.q}»`;
    document.getElementById('sstat').textContent=`${mc} совпадений из ${NEWS.length}`;
  }

  if(!news.length){
    el.innerHTML=`<div class="empty-feed"><div style="font-size:36px">📭</div>Нет новостей по фильтру</div>`;
    return;
  }

  el.innerHTML=news.map(n=>{
    const reg=REG.find(r=>r.id===n.rid);
    const hide=q&&!n._m;
    const titleHl=q?hl(n.title,S.q):n.title;
    const sumHl=q?hl(n.sum,S.q):n.sum;

    // choose badge: topic badge overrides type if specific
    const tb=topicBadge(n.topic);
    const srcBadge=typeBadge(n.t);
    const topicBadgeHtml=tb&&tb.cls!==srcBadge.cls?
      `<span class="badge ${tb.cls}">${tb.label}</span>`:'';

    // category icon
    const catIcon={sport:'⚽',culture:'🎭',zhkh:'🏠',emerg:'🚨',politics:'🏛',guber:'🎖',economy:'📈',ecology:'🌿',social:'👥'}[n.topic]||'';

    const rssEntry=(RSRC[n.rid]||[]).find(s=>s.n===n.src);

    return`<div class="ncard type-${n.topic==='emerg'?'emerg':n.topic==='sport'?'sport':n.topic==='culture'?'culture':n.t} ${q&&n._m?'smatch':''} ${hide?'shide':''}">
      <div class="nctop">
        <span class="badge ${srcBadge.cls}">${srcBadge.label}</span>
        ${topicBadgeHtml}
        ${catIcon?`<span style="font-size:11px">${catIcon}</span>`:''}
        <span class="nsrc">${n.src}</span>
        ${reg?`<span class="nreg">${reg.n}</span>`:''}
        <span class="ntime">${n.time} назад</span>
      </div>
      <a class="ntitle-link" href="${n.url}" target="_blank" rel="noopener">${titleHl}</a>
      <div class="nsum">${sumHl}</div>
      <div class="nfooter">
        <a class="nlink" href="${n.url}" target="_blank" rel="noopener">Читать статью ↗</a>
        ${rssEntry?`<span class="nrss">RSS: <a href="${rssEntry.u}" target="_blank">${rssEntry.u.replace('https://','').split('/')[0]}</a></span>`:''}
        <div class="ntags">${(n.tags||[]).map(tag=>`<span class="ntag" onclick="quickTag('${tag}')">#${tag}</span>`).join('')}</div>
      </div>
    </div>`;
  }).join('');
}

/* ══════════════════════════════════════════
   SEARCH
══════════════════════════════════════════ */
let stimer=null;
function onSearch(v){
  clearTimeout(stimer);
  stimer=setTimeout(()=>{
    S.q=v.trim();
    document.getElementById('gclr').style.display=v?'block':'none';
    const bar=document.getElementById('sbar');
    if(v.trim()){bar.classList.add('vis');document.getElementById('sq').textContent=`«${v.trim()}»`}
    else bar.classList.remove('vis');
    renderNews();
  },180);
}
function clearSearch(){
  document.getElementById('gsin').value='';
  S.q=''; document.getElementById('gclr').style.display='none';
  document.getElementById('sbar').classList.remove('vis');
  renderNews();
}
function quickTag(tag){
  document.getElementById('gsin').value=tag;
  onSearch(tag);
}

/* ══════════════════════════════════════════
   RIGHT PANEL
══════════════════════════════════════════ */
function rTab(tab,el){
  S.rtab=tab;
  document.querySelectorAll('.rptab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.rppane').forEach(p=>p.classList.remove('active'));
  document.getElementById('rp-'+tab).classList.add('active');
}

function renderRight(){
  const el=document.getElementById('rp-sources');
  if(S.selReg){
    const r=REG.find(x=>x.id===S.selReg);
    const srcs=RSRC[S.selReg]||[];
    const byT={};
    srcs.forEach(s=>{(byT[s.t]=byT[s.t]||[]).push(s)});
    el.innerHTML=
      `<div style="padding:9px 12px;border-bottom:1px solid var(--border)">
        <div style="font-size:11px;font-weight:600">${r.n}</div>
        <div style="font-size:9px;color:var(--muted2);margin-top:2px">${srcs.length} источников региона</div>
       </div>`+
      Object.entries(byT).map(([t,items])=>srcGroup(t,items)).join('')+
      federalGroups();
    return;
  }
  el.innerHTML=federalGroups();
}

function srcGroup(type,items){
  const cfg={
    news:{ico:'📰',lbl:'Новостные СМИ',ic:'rei-n'},
    gov:{ico:'🏛',lbl:'Госорганы',ic:'rei-g'},
    tg:{ico:'✈️',lbl:'Telegram',ic:'rei-t'},
    sport:{ico:'⚽',lbl:'Спорт',ic:'rei-s'},
    culture:{ico:'🎭',lbl:'Культура',ic:'rei-c'},
    emerg:{ico:'🚨',lbl:'МЧС/ЧП',ic:'rei-e'},
    social:{ico:'👥',lbl:'Социалка',ic:'rei-n'},
    zhkh:{ico:'🏠',lbl:'ЖКХ',ic:'rei-n'},
  }[type]||{ico:'📡',lbl:type,ic:'rei-n'};

  return`<div class="rgrp open">
    <div class="rgrph" onclick="this.parentElement.classList.toggle('open')">
      <span class="rgi">${cfg.ico}</span>
      <span class="rgn">${cfg.lbl}</span>
      <span class="rgc">${items.length}</span>
      <span class="rga">›</span>
    </div>
    <div class="rgrpb">
      ${items.map(s=>{
        const url=s.u||(s.ch?`https://t.me/${s.ch.replace('@','')}`:'#');
        const sub=s.ch||s.u?.replace('https://','').split('/')[0]||'';
        return`<div class="rent" onclick="window.open('${url}','_blank')">
          <div class="reico ${cfg.ic}">${cfg.ico}</div>
          <div class="rein">
            <div class="renn">${s.n}</div>
            <div class="rets">${sub}</div>
          </div>
          <div class="rtog on" onclick="event.stopPropagation();this.classList.toggle('on')"></div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function federalGroups(){
  const groups=[
    ['news',FSRC.smi],
    ['gov',FSRC.gov],
    ['sport',FSRC.sport],
    ['culture',FSRC.culture],
    ['social',FSRC.social],
    ['tg',FSRC.tg],
  ];
  return`<div style="padding:6px 12px 3px;font-size:8px;letter-spacing:.8px;color:var(--muted2);text-transform:uppercase">Федеральные источники</div>`+
    groups.map(([t,items])=>srcGroup(t,items)).join('');
}

/* GOVERNORS */
function renderGubers(){
  document.getElementById('rp-gubers').innerHTML=GUBERS.map(g=>
    `<div class="gubi" onclick="window.open('${g.url}','_blank')">
      <div class="gubname">${g.name}</div>
      <div class="gubreg">${g.reg}</div>
      <div class="gubtext">${g.text}</div>
      <a class="gublink" href="${g.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Официальная страница ↗</a>
      <div class="gubtime">${g.time}</div>
    </div>`
  ).join('');
}

/* STATS */
function updateStats(){
  let total=Object.values(RSRC).reduce((s,a)=>s+a.length,0);
  total+=FSRC.smi.length+FSRC.gov.length+FSRC.sport.length+FSRC.culture.length+FSRC.social.length+FSRC.tg.length;
  document.getElementById('stnews').textContent=NEWS.length+'+';
  document.getElementById('stsrc').textContent=total+'+';
}
